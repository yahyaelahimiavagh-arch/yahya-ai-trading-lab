name: SML public dataset schema probe
on:
  push:
    branches: [research/sml-public-wallet-discovery]
    paths: [".github/workflows/sml-public-data-schema.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free analytics reader
        run: python -m pip install duckdb==1.4.1 pytz
      - name: Read public dataset parquet schema with no blockchain RPC
        run: |
          python - <<'PY'
          import duckdb, urllib.request, pathlib
          base="https://raw.githubusercontent.com/ian05012/solana-memecoin-dataset/main/data/"
          root=pathlib.Path("/tmp/sml_public_probe")
          root.mkdir()
          for filename in ("tokens.parquet","trades-000.parquet","ohlcv.parquet","wallets.parquet"):
              url=base+filename
              print("downloading", filename, flush=True)
              urllib.request.urlretrieve(url, root/filename)
              print("bytes", (root/filename).stat().st_size,flush=True)
          con=duckdb.connect()
          for name in ("tokens","trades-000","ohlcv","wallets"):
              source=str(root/(name+".parquet"))
              print(name,con.execute("DESCRIBE SELECT * FROM read_parquet(?)",[source]).fetchall(),flush=True)
              if name=="tokens":
                  print("tokens time and return",con.execute("select captured_at, close_return_1h, liquidity_usd from read_parquet(?) limit 4",[source]).fetchall(),flush=True)
              if name=="trades-000":
                  print("trades time and amount",con.execute("select ts, side, amount_usd from read_parquet(?) limit 4",[source]).fetchall(),flush=True)
              if name=="ohlcv":
                  print("ohlcv time",con.execute("select ts, close from read_parquet(?) limit 4",[source]).fetchall(),flush=True)
          print("token 1h ratio quantiles",con.execute("select quantile_cont(close_return_1h,[0.01,0.1,0.5,0.9,0.99]) from read_parquet(?)",[str(root/"tokens.parquet")]).fetchone(),flush=True)
          print("token time range",con.execute("select min(captured_at),max(captured_at) from read_parquet(?)",[str(root/"tokens.parquet")]).fetchone(),flush=True)
          print("trade min/max",con.execute("select min(ts), max(ts), count(*) from read_parquet(?)",[str(root/"trades-000.parquet")]).fetchone(),flush=True)
          print("trade year counts",con.execute("select year(ts), count(*) from read_parquet(?) group by 1 order by 1",[str(root/"trades-000.parquet")]).fetchall(),flush=True)
          print("eligible tokens",con.execute("select count(*) filter (where liquidity_usd>=20000 and close_return_1h is not null) from read_parquet(?)",[str(root/"tokens.parquet")]).fetchone(),flush=True)
          print("token label coverage",con.execute("""
          select count(*),
          count(*) filter (where reaches_2x is not null),
          count(*) filter (where reaches_2x is not null and liquidity_usd>=1000),
          count(*) filter (where reaches_2x is not null and liquidity_usd>=5000),
          count(*) filter (where reaches_2x is not null and liquidity_usd>=20000)
          from read_parquet(?)""",[str(root/"tokens.parquet")]).fetchone(),flush=True)
          print("token unique",con.execute("select count(distinct token_address), count(distinct date(captured_at)) from read_parquet(?)",[str(root/"tokens.parquet")]).fetchone(),flush=True)
          print("snapshot buyers 1k / shard0",con.execute("""
          select count(*),count(distinct b.wallet),count(distinct t.token_address)
          from read_parquet(?) t join read_parquet(?) b using(token_address)
          where b.side='buy' and b.ts between t.captured_at-interval '15 minutes' and t.captured_at
          and b.amount_usd>=10 and t.liquidity_usd>=1000 and t.reaches_2x is not null
          """,[str(root/"tokens.parquet"),str(root/"trades-000.parquet")]).fetchone(),flush=True)
          print("snapshot matches recent buyers",con.execute("""
          select count(*), count(distinct b.wallet),count(distinct t.token_address)
          from read_parquet(?) t join read_parquet(?) b using(token_address)
          where b.side='buy' and b.ts between t.captured_at - interval '15 minutes' and t.captured_at
          and b.amount_usd>=10 and t.liquidity_usd>=20000 and t.close_return_1h is not null
          """,[str(root/"tokens.parquet"), str(root/"trades-000.parquet")]).fetchone(),flush=True)
          PY