name: P5 deterministic gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - name: Install locked runner
        run: python -m pip install uv==0.12.11
      - name: Sync exact dependencies
        run: uv sync --locked
      - name: Complete test suite
        run: uv run --locked python -m unittest discover -s tests -v
      - name: P5 startup reconciliation focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_reconcile.py' -v
      - name: P5 snapshot recovery focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_recovery.py' -v
      - name: P5 guarded operator CLI focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_runner.py' -v
      - name: P5 adversarial execution matrix focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_scenarios.py' -v
      - name: P5 independent final audit focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_audit.py' -v
      - name: P6 analyst contracts focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_contracts.py' -v
      - name: P6 point-in-time evidence focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_evidence.py' -v
      - name: P6 deterministic analyst baseline focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_baseline.py' -v
      - name: P6 model request boundary focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_request.py' -v
      - name: P6 strict model-response schema focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_response.py' -v
      - name: P6 claim/evidence grounding focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_grounding.py' -v
      - name: P6 analyst journal focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_journal.py' -v
      - name: P6 guarded analyst CLI focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_cli.py' -v
      - name: P6 adversarial analyst matrix focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_scenarios.py' -v
      - name: P6 independent final audit focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_audit.py' -v
      - name: P7 analytics contracts focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_contracts.py' -v
      - name: P7 read-only ingestion focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_ingestion.py' -v
      - name: P7 unified timeline focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_timeline.py' -v
      - name: P7 completed Paper trades focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_trades.py' -v
      - name: P7 deterministic performance metrics focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_metrics.py' -v
      - name: P7 strategy and evidence segmentation focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_segmentation.py' -v
      - name: P7 analytics quality gate focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_quality.py' -v
      - name: P7 guarded analytics CLI/export focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_cli.py' -v
      - name: P7 adversarial analytics matrix focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_scenarios.py' -v
      - name: P7 independent final audit focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analytics_audit.py' -v
      - name: P8 Dashboard contracts focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_contracts.py' -v
      - name: P8 accepted P7 export loader focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_loader.py' -v
      - name: P8 system safety quality overview focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_overview.py' -v
      - name: P8 completed trade table focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_trade_table.py' -v
      - name: P8 performance segmentation focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_performance_views.py' -v
      - name: P8 quality diagnostic focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_quality_view.py' -v
      - name: P8 deterministic renderer focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_renderer.py' -v
      - name: P8 guarded dashboard CLI focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_cli.py' -v
      - name: P8 adversarial dashboard matrix focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_scenarios.py' -v
      - name: P8 independent final audit focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_dashboard_audit.py' -v
      - name: P9 notification contracts focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_notification_contracts.py' -v
      - name: P9 upstream projection and formatter focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_notification_projection.py' -v
      - name: P9 outbound-only Telegram transport focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_telegram_transport.py' -v
      - name: Compile and whitespace gates
        run: |
          uv run --locked python -m compileall -q yatl
          git diff --check
      - name: Safety boundary scan
        run: |
          command -v git >/dev/null
          command -v grep >/dev/null
          git check-ignore -q .env
          test -z "$(git ls-files | grep -E '(^|/)\.env$' || true)"

          assert_absent() {
            local pattern="$1"
            shift
            local status=0
            git grep -nE "$pattern" -- "$@" && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "Forbidden safety-boundary pattern found: $pattern" >&2
              exit 1
            fi
            if [ "$status" -ne 1 ]; then
              echo "Safety scan failed with status $status: $pattern" >&2
              exit "$status"
            fi
          }

          assert_absent 'api/v3/(order|orderList)|fapi|dapi|withdraw' yatl/strategy
          assert_absent 'from yatl\.account|import yatl\.account|BinancePublicRestClient' yatl/strategy
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/risk
          assert_absent 'from yatl\.account|import yatl\.account|BinancePublicRestClient' yatl/risk
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/execution
          assert_absent 'from yatl\.account|import yatl\.account|BinancePublicRestClient|urllib|http\.client|websockets|socket' yatl/execution
          assert_absent 'os\.getenv|os\.environ|dotenv|API_KEY|API_SECRET' yatl/execution
          assert_absent 'input\(|importlib|eval\(|exec\(|endpoint|url' yatl/execution/runner.py
          assert_absent 'from yatl\.execution|import yatl\.execution' yatl/strategy yatl/risk
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/analyst
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|urllib|http\.client|websockets|socket' yatl/analyst
          assert_absent 'os\.getenv|os\.environ|dotenv|API_KEY|API_SECRET' yatl/analyst
          assert_absent 'requests|httpx|aiohttp|openai|anthropic' yatl/analyst
          assert_absent 'from yatl\.risk|import yatl\.risk|authorize_paper_request|RiskManagedPaperAdapter' yatl/analyst
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/analytics
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/analytics
          assert_absent 'os\.getenv|os\.environ|dotenv|API_KEY|API_SECRET|requests|httpx|aiohttp|openai|anthropic' yatl/analytics
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/dashboard
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/dashboard
          assert_absent 'os\.getenv|os\.environ|dotenv|API_KEY|API_SECRET|requests|httpx|aiohttp|openai|anthropic' yatl/dashboard
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|database_path|local_paper|analyst_journal' yatl/dashboard/loader.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|datetime|time\.time|time\.monotonic|sqlite3|database_path|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/dashboard/overview.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|database_path|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/dashboard/trade_table.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|database_path|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/dashboard/performance_views.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|database_path|local_paper|analyst_journal|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/dashboard/quality_view.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|database_path|from pathlib|import pathlib|tempfile|open\(|write_text|write_bytes|os\.replace|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket' yatl/dashboard/renderer.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|database_path|local_paper|analyst_journal|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket|requests|httpx|aiohttp|openai|anthropic|os\.getenv|os\.environ' yatl/dashboard/cli.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|local_paper|analyst_journal|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket|requests|httpx|aiohttp|openai|anthropic|os\.getenv|os\.environ' yatl/dashboard/scenarios.py
          assert_absent 'from yatl\.analytics|import yatl\.analytics|sqlite3|local_paper|analyst_journal|from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket|requests|httpx|aiohttp|openai|anthropic|os\.getenv|os\.environ' yatl/dashboard/audit.py
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/notifications
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk' yatl/notifications
          assert_absent 'dotenv|API_KEY|API_SECRET|openai|anthropic' yatl/notifications
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|http\.client|websockets|socket|requests|httpx|aiohttp|os\.getenv|os\.environ|openai|anthropic' yatl/notifications/projection.py yatl/notifications/formatter.py
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|from yatl\.risk|import yatl\.risk|urllib|websockets|socket|requests|httpx|aiohttp|openai|anthropic|input\(|eval\(|exec\(' yatl/notifications/transport.py
          assert_absent 'getUpdates|setWebhook|deleteWebhook|answerCallbackQuery|editMessageText|sendPhoto|sendDocument|forwardMessage' yatl/notifications/transport.py
          transport_capability_files="$(git grep -lE 'http\.client|os\.environ|ssl\.create_default_context' -- yatl/notifications || true)"
          test "$transport_capability_files" = "yatl/notifications/transport.py"
      - name: P4 risk contract runtime
        run: uv run --locked python -m yatl risk-contract-check
      - name: P4 exact sizing runtime
        run: uv run --locked python -m yatl risk-sizing-check
      - name: P4 cash and exposure limits runtime
        run: uv run --locked python -m yatl risk-limit-check
      - name: P4 portfolio and session state runtime
        run: uv run --locked python -m yatl risk-state-check
      - name: P4 protective and cost gate runtime
        run: uv run --locked python -m yatl risk-protective-check
      - name: P4 loss and drawdown circuit-breaker runtime
        run: uv run --locked python -m yatl risk-circuit-check
      - name: P4 fail-closed Kill Switch runtime
        run: uv run --locked python -m yatl risk-kill-switch-check
      - name: P4-authorized P2 Paper adapter runtime
        run: uv run --locked python -m yatl risk-adapter-check
      - name: P5 local Paper execution contract runtime
        run: uv run --locked python -m yatl paper-execution-contract-check
      - name: P5 transactional intent journal runtime
        run: uv run --locked python -m yatl paper-execution-journal-check
      - name: P5 local Paper order state runtime
        run: uv run --locked python -m yatl paper-order-state-check
      - name: P5 accepted P2 fill and cost runtime
        run: uv run --locked python -m yatl paper-fill-cost-check
      - name: P5 atomic fill and portfolio projection runtime
        run: uv run --locked python -m yatl paper-portfolio-check
      - name: P5 startup reconciliation runtime
        run: uv run --locked python -m yatl.execution.reconcile_runtime
      - name: P5 snapshot recovery runtime
        run: uv run --locked python -m yatl.execution.recovery_runtime
      - name: P5 guarded operator CLI runtime
        run: uv run --locked python -m yatl.execution.runner_runtime
      - name: P5-009 adversarial execution matrix twice
        run: |
          uv run --locked python -m yatl.execution.scenarios_runtime \
            --output data/p5/p5-009-evidence
          uv run --locked python -m yatl.execution.scenarios_runtime \
            --output data/p5/p5-009-evidence-replay
          diff -r data/p5/p5-009-evidence data/p5/p5-009-evidence-replay
          sha256sum data/p5/p5-009-evidence/p5-009-index.json
      - name: P5-010 independent final audit
        run: |
          uv run --locked python -m yatl.execution.audit_runtime \
            --evidence data/p5/p5-009-evidence
      - name: P6 analyst contract runtime
        run: uv run --locked python -m yatl.analyst.contract_runtime
      - name: P6 point-in-time evidence runtime
        run: uv run --locked python -m yatl.analyst.evidence_runtime
      - name: P6 deterministic analyst baseline runtime
        run: uv run --locked python -m yatl.analyst.baseline_runtime
      - name: P6 model request boundary runtime
        run: uv run --locked python -m yatl.analyst.request_runtime
      - name: P6 strict model-response schema runtime
        run: uv run --locked python -m yatl.analyst.response_runtime
      - name: P6 claim/evidence grounding runtime
        run: uv run --locked python -m yatl.analyst.grounding_runtime
      - name: P6 analyst journal and trace runtime
        run: uv run --locked python -m yatl.analyst.journal_runtime
      - name: P6 guarded analyst CLI runtime
        run: uv run --locked python -m yatl.analyst.cli_runtime
      - name: P6-009 adversarial analyst matrix twice
        run: |
          uv run --locked python -m yatl.analyst.scenarios \
            --output data/p6/p6-009-evidence
          uv run --locked python -m yatl.analyst.scenarios \
            --output data/p6/p6-009-evidence-replay
          diff -r data/p6/p6-009-evidence data/p6/p6-009-evidence-replay
          sha256sum data/p6/p6-009-evidence/p6-009-index.json
      - name: P6-010 independent final audit
        run: |
          uv run --locked python -m yatl.analyst.audit_runtime \
            --evidence data/p6/p6-009-evidence
      - name: P7 analytics contract runtime
        run: uv run --locked python -m yatl.analytics.contract_runtime
      - name: P7 read-only ingestion runtime
        run: uv run --locked python -m yatl.analytics.ingestion_runtime
      - name: P7 unified point-in-time timeline runtime
        run: uv run --locked python -m yatl.analytics.timeline_runtime
      - name: P7 completed Paper trade reconstruction runtime
        run: uv run --locked python -m yatl.analytics.trade_runtime
      - name: P7 deterministic performance metrics runtime
        run: uv run --locked python -m yatl.analytics.metrics_runtime
      - name: P7 strategy and evidence segmentation runtime
        run: uv run --locked python -m yatl.analytics.segmentation_runtime
      - name: P7 reconciliation and analytics quality runtime
        run: uv run --locked python -m yatl.analytics.quality_runtime
      - name: P7 guarded analytics CLI/export runtime
        run: uv run --locked python -m yatl.analytics.cli_runtime
      - name: P7-009 adversarial analytics matrix twice
        run: |
          uv run --locked python -m yatl.analytics.scenarios \
            --output data/p7/p7-009-evidence
