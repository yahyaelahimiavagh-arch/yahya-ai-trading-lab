      - name: P8 accepted P7 export loader runtime
        run: uv run --locked python -m yatl.dashboard.loader_runtime
      - name: P8 system safety quality overview runtime
        run: uv run --locked python -m yatl.dashboard.overview_runtime
      - name: P8 completed trade table runtime
        run: uv run --locked python -m yatl.dashboard.trade_table_runtime
      - name: P8 performance segmentation runtime
        run: uv run --locked python -m yatl.dashboard.performance_views_runtime
      - name: P8 quality diagnostic runtime
        run: uv run --locked python -m yatl.dashboard.quality_view_runtime
      - name: P8 deterministic renderer runtime
        run: uv run --locked python -m yatl.dashboard.renderer_runtime
      - name: P8 guarded dashboard CLI runtime
        run: uv run --locked python -m yatl.dashboard.cli_runtime
      - name: P8 adversarial dashboard matrix runtime
        run: |
          mkdir -p data/p8
          uv run --locked python -m yatl.dashboard.scenarios_runtime --output data/p8/p8-009-evidence
      - name: P8 independent final audit runtime
        run: uv run --locked python -m yatl.dashboard.audit_runtime --evidence data/p8/p8-009-evidence
