name: P5 deterministic gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - name: Install locked runner
        run: python -m pip install uv==0.12.11
      - name: Sync exact dependencies
        run: uv sync --locked
      - name: Complete test suite
        run: uv run --locked python -m unittest discover -s tests -v
      - name: P5 startup reconciliation focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_reconcile.py' -v
      - name: P5 snapshot recovery focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_recovery.py' -v
      - name: P5 guarded operator CLI focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_runner.py' -v
      - name: P5 adversarial execution matrix focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_scenarios.py' -v
      - name: P5 independent final audit focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_execution_audit.py' -v
      - name: P6 analyst contracts focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_contracts.py' -v
      - name: P6 point-in-time evidence focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_evidence.py' -v
      - name: P6 deterministic analyst baseline focused gate
        run: uv run --locked python -m unittest discover -s tests -p 'test_analyst_baseline.py' -v
      - name: Compile and whitespace gates
        run: |
          uv run --locked python -m compileall -q yatl
          git diff --check
      - name: Safety boundary scan
        run: |
          command -v git >/dev/null
          command -v grep >/dev/null
          git check-ignore -q .env
          test -z "$(git ls-files | grep -E '(^|/)\.env$' || true)"

          assert_absent() {
            local pattern="$1"
            shift
            local status=0
            git grep -nE "$pattern" -- "$@" && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "Forbidden safety-boundary pattern found: $pattern" >&2
              exit 1
            fi
            if [ "$status" -ne 1 ]; then
              echo "Safety scan failed with status $status: $pattern" >&2
              exit "$status"
            fi
          }

          assert_absent 'api/v3/(order|orderList)|fapi|dapi|withdraw' yatl/strategy
          assert_absent 'from yatl\.account|import yatl\.account|BinancePublicRestClient' yatl/strategy
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/risk
          assert_absent 'from yatl\.account|import yatl\.account|BinancePublicRestClient' yatl/risk
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/execution
          assert_absent 'from yatl\.account|import yatl\.account|BinancePublicRestClient|urllib|http\.client|websockets|socket' yatl/execution
          assert_absent 'os\.getenv|os\.environ|dotenv|API_KEY|API_SECRET' yatl/execution
          assert_absent 'input\(|importlib|eval\(|exec\(|endpoint|url' yatl/execution/runner.py
          assert_absent 'from yatl\.execution|import yatl\.execution' yatl/strategy yatl/risk
          assert_absent 'api/v3/(order|orderList)|/fapi|/dapi|withdraw\(' yatl/analyst
          assert_absent 'from yatl\.execution|import yatl\.execution|from yatl\.account|import yatl\.account|urllib|http\.client|websockets|socket' yatl/analyst
          assert_absent 'os\.getenv|os\.environ|dotenv|API_KEY|API_SECRET' yatl/analyst
          assert_absent 'requests|httpx|aiohttp|openai|anthropic' yatl/analyst
          assert_absent 'from yatl\.risk|import yatl\.risk|authorize_paper_request|RiskManagedPaperAdapter' yatl/analyst
      - name: P4 risk contract runtime
        run: uv run --locked python -m yatl risk-contract-check
      - name: P4 exact sizing runtime
        run: uv run --locked python -m yatl risk-sizing-check
      - name: P4 cash and exposure limits runtime
        run: uv run --locked python -m yatl risk-limit-check
      - name: P4 portfolio and session state runtime
        run: uv run --locked python -m yatl risk-state-check
      - name: P4 protective and cost gate runtime
        run: uv run --locked python -m yatl risk-protective-check
      - name: P4 loss and drawdown circuit-breaker runtime
        run: uv run --locked python -m yatl risk-circuit-check
      - name: P4 fail-closed Kill Switch runtime
        run: uv run --locked python -m yatl risk-kill-switch-check
      - name: P4-authorized P2 Paper adapter runtime
        run: uv run --locked python -m yatl risk-adapter-check
      - name: P5 local Paper execution contract runtime
        run: uv run --locked python -m yatl paper-execution-contract-check
      - name: P5 transactional intent journal runtime
        run: uv run --locked python -m yatl paper-execution-journal-check
      - name: P5 local Paper order state runtime
        run: uv run --locked python -m yatl paper-order-state-check
      - name: P5 accepted P2 fill and cost runtime
        run: uv run --locked python -m yatl paper-fill-cost-check
      - name: P5 atomic fill and portfolio projection runtime
        run: uv run --locked python -m yatl paper-portfolio-check
      - name: P5 startup reconciliation runtime
        run: uv run --locked python -m yatl.execution.reconcile_runtime
      - name: P5 snapshot recovery runtime
        run: uv run --locked python -m yatl.execution.recovery_runtime
      - name: P5 guarded operator CLI runtime
        run: uv run --locked python -m yatl.execution.runner_runtime
      - name: P5-009 adversarial execution matrix twice
        run: |
          uv run --locked python -m yatl.execution.scenarios_runtime \
            --output data/p5/p5-009-evidence
          uv run --locked python -m yatl.execution.scenarios_runtime \
            --output data/p5/p5-009-evidence-replay
          diff -r data/p5/p5-009-evidence data/p5/p5-009-evidence-replay
          sha256sum data/p5/p5-009-evidence/p5-009-index.json
      - name: P5-010 independent final audit
        run: |
          uv run --locked python -m yatl.execution.audit_runtime \
            --evidence data/p5/p5-009-evidence
      - name: P6 analyst contract runtime
        run: uv run --locked python -m yatl.analyst.contract_runtime
      - name: P6 point-in-time evidence runtime
        run: uv run --locked python -m yatl.analyst.evidence_runtime
      - name: P6 deterministic analyst baseline runtime
        run: uv run --locked python -m yatl.analyst.baseline_runtime
      - name: Publish P5-009 adversarial evidence
        uses: actions/upload-artifact@v4
        with:
          name: p5-009-evidence
          path: data/p5/p5-009-evidence/
          if-no-files-found: error
          retention-days: 30

  accepted-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - name: Install locked runner
        run: python -m pip install uv==0.12.11
      - name: Sync exact dependencies
        run: uv sync --locked
      - name: Rebuild accepted public checkpoint
        run: |
          uv run --locked python -m yatl dataset-restore-checkpoint \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json
          uv run --locked python -m yatl p1-audit \
            --manifest manifests/p1-market-data.json
      - name: Run P3-009 twice
        run: |
          uv run --locked python -m yatl strategy-candidate-check \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json \
            --output data/p3/p3-009-evidence
          uv run --locked python -m yatl strategy-candidate-check \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json \
            --output data/p3/p3-009-evidence-replay
          diff -r data/p3/p3-009-evidence data/p3/p3-009-evidence-replay
          sha256sum data/p3/p3-009-evidence/p3-009-index.json
      - name: Run independent P3 final audit
        run: |
          uv run --locked python -m yatl p3-audit \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json \
            --evidence data/p3/p3-009-evidence
      - name: Run P4-009 adversarial matrix twice
        run: |
          uv run --locked python -m yatl risk-scenario-check \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json \
            --output data/p4/p4-009-evidence
          uv run --locked python -m yatl risk-scenario-check \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json \
            --output data/p4/p4-009-evidence-replay
          diff -r data/p4/p4-009-evidence data/p4/p4-009-evidence-replay
          sha256sum data/p4/p4-009-evidence/p4-009-index.json
      - name: Run independent P4 final audit
        run: |
          uv run --locked python -m yatl p4-audit \
            --database data/p1/market.sqlite3 \
            --manifest manifests/p1-market-data.json \
            --evidence data/p4/p4-009-evidence
      - name: Publish reproducible evidence
        uses: actions/upload-artifact@v4
        with:
          name: p3-009-evidence
          path: data/p3/p3-009-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Publish P4 adversarial evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-009-evidence
          path: data/p4/p4-009-evidence/
          if-no-files-found: error
          retention-days: 30
